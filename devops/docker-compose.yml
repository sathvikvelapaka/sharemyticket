services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: trustpass_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=trustpass-production-docker-secret-2026
      - AES_KEY_HEX=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - HMAC_SECRET=trustpass-hmac-salt-docker-2026
      - RESERVATION_TIMEOUT_SECONDS=600
    volumes:
      - trustpass_data:/app/data
      - trustpass_uploads:/app/uploads
    networks:
      - trustpass_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: trustpass_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trustpass_net

  redis:
    image: redis:7-alpine
    container_name: trustpass_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - trustpass_net

  prometheus:
    image: prom/prometheus:latest
    container_name: trustpass_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - trustpass_net

networks:
  trustpass_net:
    driver: bridge

volumes:
  trustpass_data:
  trustpass_uploads:
